<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/cad.css">
</head>

<body>
    <h1>Cadastro</h1>

    <div>
        <h3>Dados pessoais</h3>
        <input type="text" placeholder="Nome">
        <input type="text" placeholder="Sobrenome">
        <input type="email" placeholder="Email">
        <input type="date">
    </div>

    <div>
        <h3>Endereço redidencial</h3>

        <input type="text" placeholder="CEP" id="cep">

        <input type="text" placeholder="Rua" id="rua">
        <input type="text" placeholder="Bairro" id="bai">
        <input type="text" placeholder="Cidade" id="cid">
        <input type="text" placeholder="Estado" id="uf">

    </div>

    <div>
        <h3>Senha</h3>
        <input type="password" placeholder="Crie sua Senha">
        <input type="password" placeholder="Confirme sua Senha">
    </div>

        <button>Cadastrar</button>

        <script src="../assets/script/cad.js"></script>
</body>

</html>
